<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 好感度档案</title>
<style>
:root{
  --bg:#050b14;
  --bg2:#081426;
  --panel:rgba(14,28,46,.72);
  --panel-2:rgba(18,36,58,.6);
  --line:rgba(90,150,210,.18);
  --line-2:rgba(90,150,210,.34);
  --text:#e6f2ff;
  --muted:#7f9ab5;
  --muted-2:#5a708a;
  --cyan:#5ce1ff;
  --blue:#3d8bff;
  --violet:#a78bfa;
  --pink:#ff8fc8;
  --ok:#5ce6a8;
  --warn:#ffcf6a;
  --bad:#ff7b8a;
  --gold:#ffd479;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  position:relative;
  min-height:100vh;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(61,139,255,.20), transparent 60%),
    radial-gradient(900px 620px at 92% 4%, rgba(167,139,250,.16), transparent 62%),
    radial-gradient(760px 560px at 50% 108%, rgba(92,225,255,.10), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg) 55%);
  color:var(--text);
  font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow-x:hidden;
}
/* 水下气泡 */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles i{
  position:absolute;bottom:-80px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(160,230,255,.55), rgba(92,225,255,.06) 70%);
  border:1px solid rgba(140,220,255,.22);
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
  12%{opacity:.75}
  88%{opacity:.35}
  100%{transform:translateY(-118vh) translateX(var(--dx,20px)) scale(1.15);opacity:0}
}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:34px 26px 140px}

/* ---------- 顶部 ---------- */
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:22px;
  padding:26px 30px;border-radius:22px;margin-bottom:22px;
  background:linear-gradient(135deg, rgba(20,42,70,.86), rgba(12,24,40,.7));
  border:1px solid var(--line-2);
  box-shadow:0 18px 48px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;
  background:radial-gradient(circle, rgba(92,225,255,.16), transparent 62%);
  pointer-events:none;
}
.hero-l{display:flex;align-items:center;gap:20px;min-width:0}
.brand-whale{
  width:104px;height:104px;flex:0 0 auto;object-fit:contain;
  filter:drop-shadow(0 10px 22px rgba(61,139,255,.5));
  animation:floaty 5.2s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.kicker{
  font-size:11px;letter-spacing:3.4px;text-transform:uppercase;
  color:var(--cyan);opacity:.9;margin-bottom:8px;font-weight:600;
}
h1{
  font-size:31px;font-weight:800;letter-spacing:.5px;line-height:1.16;
  background:linear-gradient(100deg,#ffffff 8%,#9fe4ff 46%,#c3b3ff 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin-top:9px;font-size:12.5px;color:var(--muted);letter-spacing:.2px}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:0 0 auto}
.sync{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:7px 14px;border-radius:999px;background:rgba(92,230,168,.09);
  border:1px solid rgba(92,230,168,.28);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2.1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{
  padding:18px 20px;border-radius:var(--radius);position:relative;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(12px);
  transition:transform .18s ease, border-color .18s ease;
}
.stat:hover{transform:translateY(-2px);border-color:var(--line-2)}
.stat::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--cyan),var(--blue));opacity:.85;
}
.stat.s2::before{background:linear-gradient(180deg,var(--violet),var(--blue))}
.stat.s3::before{background:linear-gradient(180deg,var(--gold),var(--warn))}
.stat.s4::before{background:linear-gradient(180deg,var(--pink),var(--violet))}
.stat .n{font-size:29px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat .l{margin-top:5px;font-size:11.5px;color:var(--muted);letter-spacing:.6px}

/* ---------- 工具条 ---------- */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{
  flex:1;min-width:230px;display:flex;align-items:center;gap:10px;
  padding:0 16px;height:44px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);
}
.search svg{flex:0 0 auto;opacity:.55}
.search input{
  flex:1;background:none;border:0;outline:0;color:var(--text);
  font-size:13.5px;font-family:inherit;
}
.search input::placeholder{color:var(--muted-2)}
.btn{
  height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--panel-2);color:var(--text);font-size:13px;font-family:inherit;
  cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px;
  font-weight:600;letter-spacing:.3px;
}
.btn:hover{background:rgba(61,139,255,.18);border-color:rgba(92,225,255,.5)}
.btn.primary{
  background:linear-gradient(135deg,#3d8bff,#5ce1ff);border-color:transparent;color:#04121f;
  box-shadow:0 10px 26px -12px rgba(92,225,255,.9);
}
.btn.primary:hover{filter:brightness(1.08)}

/* ---------- 列表 ---------- */
.board{
  border-radius:20px;overflow:hidden;
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(12px);
  box-shadow:0 22px 60px -30px rgba(0,0,0,.95);
}
.thead,.row{
  display:grid;
  grid-template-columns:56px minmax(190px,1.55fr) 118px 96px minmax(160px,1.5fr) 132px;
  align-items:center;gap:14px;padding:0 22px;
}
.thead{
  height:46px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted-2);border-bottom:1px solid var(--line);
  background:rgba(8,18,32,.55);
}
.thead > div:nth-child(4){padding-right:14px}
.thead > div:nth-child(5){padding-left:6px}
.row{
  height:74px;border-bottom:1px solid rgba(90,150,210,.09);
  transition:background .16s ease;position:relative;
}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(61,139,255,.07)}
.rank{
  font-size:13px;font-weight:800;color:var(--muted-2);font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.row.top1 .rank{color:var(--gold);text-shadow:0 0 16px rgba(255,212,121,.55)}
.row.top2 .rank{color:#cfd8e6}
.row.top3 .rank{color:#d8a179}
.who{display:flex;align-items:center;gap:13px;min-width:0}
.ava{
  width:44px;height:44px;border-radius:13px;flex:0 0 auto;object-fit:cover;
  background:linear-gradient(135deg,#1a3350,#0e1e33);
  border:1px solid rgba(120,180,230,.28);
  box-shadow:0 6px 16px -8px rgba(0,0,0,.9);
}
.row.top1 .ava{border-color:rgba(255,212,121,.62);box-shadow:0 0 0 2px rgba(255,212,121,.16),0 6px 18px -8px rgba(255,212,121,.5)}
.name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uid{font-size:11px;color:var(--muted-2);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  height:26px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:700;
  letter-spacing:.5px;white-space:nowrap;border:1px solid transparent;
}
.val{
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  text-align:right;padding-right:4px;
}
.bar{height:7px;border-radius:99px;background:rgba(120,170,220,.14);overflow:hidden;position:relative}
.bar i{
  display:block;height:100%;border-radius:99px;
  transition:width .5s cubic-bezier(.22,.8,.3,1);
  box-shadow:0 0 14px -2px currentColor;
}
.edit{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.edit input{
  width:66px;height:32px;border-radius:9px;text-align:center;
  background:rgba(6,14,24,.8);border:1px solid var(--line-2);color:var(--text);
  font-size:13px;font-family:inherit;outline:0;font-variant-numeric:tabular-nums;
}
.edit input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(92,225,255,.12)}
.mini{
  height:32px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;
  background:rgba(61,139,255,.16);border:1px solid rgba(61,139,255,.38);
  color:#cfe6ff;cursor:pointer;font-family:inherit;transition:.15s;
}
.mini:hover{background:rgba(92,225,255,.26);border-color:var(--cyan);color:#fff}

/* ---------- 空态 / 模态 ---------- */
.empty{padding:76px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;margin-bottom:8px;color:var(--text);font-weight:600}
.empty .small{font-size:12.5px;color:var(--muted-2)}
.foot{margin-top:18px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2);letter-spacing:.3px}
.mask{
  position:fixed;inset:0;background:rgba(3,8,15,.74);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:50;
}
.mask.on{display:flex}
.modal{
  width:400px;max-width:calc(100vw - 36px);padding:26px;border-radius:20px;
  background:linear-gradient(160deg,rgba(20,40,66,.98),rgba(10,20,34,.98));
  border:1px solid var(--line-2);box-shadow:0 30px 80px -30px #000;
}
.modal h3{font-size:16px;margin-bottom:18px;letter-spacing:.4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.5px}
.field input{
  width:100%;height:40px;padding:0 13px;border-radius:10px;
  background:rgba(6,14,24,.85);border:1px solid var(--line-2);color:var(--text);
  font-size:13.5px;font-family:inherit;outline:0;
}
.field input:focus{border-color:var(--cyan)}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ---------- 等级总览 ---------- */
.lv-modal{width:560px;max-width:calc(100vw - 32px);padding:24px 24px 18px}
.lv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.lv-head h3{font-size:17px;letter-spacing:.4px}
.lv-list{display:flex;flex-direction:column;gap:7px;max-height:min(64vh,540px);overflow-y:auto;padding-right:4px}
.lv-list::-webkit-scrollbar{width:6px}
.lv-list::-webkit-scrollbar-thumb{background:rgba(120,170,220,.28);border-radius:99px}
.lv-item{
  display:grid;grid-template-columns:26px 96px 1fr 92px 62px;
  align-items:center;gap:11px;padding:10px 13px;border-radius:12px;
  background:rgba(10,22,38,.5);border:1px solid rgba(90,150,210,.14);
  transition:transform .15s, border-color .15s;
}
.lv-item:hover{transform:translateX(3px);border-color:var(--line-2)}
.lv-item.now{border-color:rgba(92,225,255,.5);background:rgba(92,225,255,.07)}
.lv-i{font-size:11px;font-weight:800;color:var(--muted-2);font-variant-numeric:tabular-nums}
.lv-name{font-size:13.5px;font-weight:700;letter-spacing:.4px}
.lv-track{height:6px;border-radius:99px;background:rgba(120,170,220,.13);overflow:hidden;position:relative}
.lv-track i{display:block;height:100%;border-radius:99px;box-shadow:0 0 12px -2px currentColor}
.lv-range{font-size:11px;color:var(--muted-2);text-align:right;font-variant-numeric:tabular-nums}
.lv-cnt{font-size:11.5px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.lv-cnt b{color:var(--text);font-weight:700}

.ro{float:right;font-size:11px;letter-spacing:.08em;color:#7f9ab5;opacity:.75;
  border:1px solid rgba(127,154,181,.28);border-radius:6px;padding:2px 7px}
.ro-note{margin-top:10px;font-size:12px;color:#7f9ab5;opacity:.8}

/* ---------- 左右两侧的「大肥鱼」水印字 ---------- */
.side-word{
  position:fixed;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:clamp(54px,6.4vw,104px);font-weight:900;line-height:1;
  letter-spacing:.28em;
  color:rgba(140,200,255,.045);
  -webkit-text-stroke:1.4px rgba(120,190,255,.20);
  text-stroke:1.4px rgba(120,190,255,.20);
  z-index:2;pointer-events:none;user-select:none;
  text-shadow:0 0 42px rgba(61,139,255,.16);
  animation:sideGlow 7.5s ease-in-out infinite;
}
.side-word.left{left:6px}
.side-word.right{right:6px;animation-delay:-3.7s}
@keyframes sideGlow{
  0%,100%{opacity:.72}
  50%    {opacity:1}
}
@media (max-width:1180px){
  .side-word{font-size:clamp(42px,5vw,64px);-webkit-text-stroke-width:1px;opacity:.6}
}
@media (max-width:760px){
  .side-word{display:none}
}

/* ---------- 浮空漂游的两只 ---------- */
.fly{
  position:fixed;top:16%;left:6%;width:62px;height:62px;z-index:35;
  pointer-events:none;user-select:none;will-change:transform;
  opacity:.82;animation:driftA 47s ease-in-out infinite;
}
.fly .inner{
  width:100%;height:100%;
  animation:bobfly 3.6s ease-in-out infinite, tilt 7.5s ease-in-out infinite;
}
.fly img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 8px 18px rgba(61,139,255,.42))}
.fly.f2{
  top:60%;left:70%;width:48px;height:48px;opacity:.72;
  animation:driftB 39s ease-in-out infinite;
}
.fly.f2 .inner{animation-duration:2.9s,6.2s}
@keyframes driftA{
  0%,100%{transform:translate(0,0) rotate(-4deg)}
  22%    {transform:translate(16vw,-9vh) rotate(4deg)}
  46%    {transform:translate(40vw,4vh) rotate(-3deg)}
  70%    {transform:translate(24vw,16vh) rotate(5deg)}
}
@keyframes driftB{
  0%,100%{transform:translate(0,0) rotate(4deg)}
  20%    {transform:translate(-14vw,-14vh) rotate(-6deg)}
  45%    {transform:translate(-34vw,-3vh) rotate(5deg)}
  68%    {transform:translate(-10vw,11vh) rotate(-3deg)}
}
@keyframes bobfly{
  0%,100%{transform:translateY(-7px) scale(1)}
  50%    {transform:translateY(7px) scale(1.03)}
}
@keyframes tilt{
  0%,100%{rotate:-3deg}
  50%    {rotate:3deg}
}
@media (max-width:760px){
  .fly{width:46px;height:46px}
  .fly.f2{width:36px;height:36px}
}

/* ---------- 走来走去的鲸鱼娘（三只，各走各的） ---------- */
.walker{
  position:absolute;bottom:8px;right:28px;width:78px;height:78px;z-index:40;
  pointer-events:none;will-change:transform;opacity:.94;
  --dist:min(560px,46vw);
  animation:walkPath 30s linear infinite;
}
.walker.w2{
  right:250px;bottom:12px;width:64px;height:64px;
  --dist:min(420px,35vw);opacity:.86;
  animation-duration:37s;animation-delay:-13s;
}
.walker.w3{
  right:470px;bottom:18px;width:56px;height:56px;
  --dist:min(320px,27vw);opacity:.78;
  animation-duration:25s;animation-delay:-7s;
}
.walker .inner{
  width:100%;height:100%;transform-origin:50% 88%;
  animation:bob 1.15s ease-in-out infinite, hop 9.5s ease-in-out infinite;
}
.walker.w2 .inner{animation-duration:1.32s, 11s; animation-delay:0s, -3s}
.walker.w3 .inner{animation-duration:1.02s, 8s; animation-delay:0s, -5s}
.walker img{
  width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 9px 18px rgba(61,139,255,.5));
}
@keyframes walkPath{
  0%   {transform:translateX(0)}
  6%   {transform:translateX(0)}
  46%  {transform:translateX(calc(-1 * var(--dist)))}
  50%  {transform:translateX(calc(-1 * var(--dist))) scaleX(-1)}
  54%  {transform:translateX(calc(-1 * var(--dist))) scaleX(-1)}
  94%  {transform:translateX(0) scaleX(-1)}
  98%  {transform:translateX(0) scaleX(-1)}
  100% {transform:translateX(0) scaleX(1)}
}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-2.5deg)}
  25%    {transform:translateY(-3px) rotate(0deg)}
  50%    {transform:translateY(-6px) rotate(2.5deg)}
  75%    {transform:translateY(-3px) rotate(0deg)}
}
@keyframes hop{
  0%,84%  {filter:none}
  88%     {transform:translateY(-26px) scaleY(1.07) scaleX(.96)}
  91%     {transform:translateY(2px) scaleY(.93) scaleX(1.05)}
  94%     {transform:translateY(0) scaleY(1) scaleX(1)}
  100%    {filter:none}
}
@media (max-width:640px){
  .walker{width:70px;height:70px;right:14px;bottom:10px}
}
@media (prefers-reduced-motion: reduce){
  .walker,.walker .inner{animation:none}
}
.toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  padding:11px 22px;border-radius:12px;font-size:13px;
  background:rgba(16,34,54,.96);border:1px solid var(--line-2);
  opacity:0;transition:.24s;pointer-events:none;z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:rgba(255,123,138,.6);color:#ffd3d8}

@media (max-width:980px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .thead{display:none}
  .row{
    grid-template-columns:44px 1fr auto;grid-template-areas:"r w v" "r m m" "r b b" "r e e";
    height:auto;padding:16px 18px;row-gap:10px;
  }
  .rank{grid-area:r;align-self:start;padding-top:5px}
  .who{grid-area:w}
  .lv{grid-area:m;display:flex;align-items:center;gap:10px}
.ov{font-size:11px;font-weight:600;color:#7fe0ff;margin-left:5px;opacity:.9}
.spark{flex:0 0 auto}
  .val{grid-area:v;text-align:right}
  .bar{grid-area:b}
  .edit{grid-area:e;justify-content:flex-start}
  .hero{flex-direction:column;align-items:flex-start}
  .hero-r{align-items:flex-start}
}
@media (max-width:560px){
  .wrap{padding:20px 14px 120px}
  h1{font-size:24px}
  .brand-whale{width:70px;height:70px}
  .stat .n{font-size:24px}
  .row{padding:14px 12px;grid-template-columns:34px 1fr auto}
  .rank{font-size:15px}
  .badge{font-size:11px;padding:3px 9px}
  .toast{bottom:16px;font-size:12px;padding:9px 16px}
}

/* ===== beautify layer v2 (append-only overrides) ===== */
/* top light shaft + bottom water glow */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 640px at 50% -16%, rgba(92,225,255,.17), transparent 62%),
    linear-gradient(178deg, rgba(61,139,255,.10) 0%, transparent 34%);
}
body::after{
  content:"";position:fixed;left:0;right:0;bottom:0;height:240px;z-index:0;pointer-events:none;
  background:linear-gradient(0deg, rgba(92,225,255,.08), transparent);
}

/* stat cards: per-card tint + inner glow */
.stat{
  background:linear-gradient(160deg, rgba(22,42,68,.92), rgba(12,24,40,.88)) !important;
  border:1px solid rgba(110,170,230,.16) !important;
  box-shadow:inset 0 1px 0 rgba(160,220,255,.10), 0 18px 40px -26px rgba(0,0,0,.9) !important;
  position:relative;overflow:hidden;
}
.stat::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(260px 130px at 10% -10%, rgba(92,225,255,.16), transparent 70%);
}
.stat.s3::after{background:radial-gradient(260px 130px at 10% -10%, rgba(255,212,121,.16), transparent 70%)}
.stat.s4::after{background:radial-gradient(260px 130px at 10% -10%, rgba(255,138,190,.16), transparent 70%)}
.stat .n{text-shadow:0 0 28px rgba(92,225,255,.30)}

/* rank: circular medallion, top3 metal */
.rank{
  display:flex !important;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  font-size:13px !important;font-weight:800 !important;
  background:rgba(120,170,220,.10);
  border:1px solid rgba(120,170,220,.22);
  font-variant-numeric:tabular-nums;
  align-self:center;
}
.row.top1 .rank{
  background:linear-gradient(160deg, rgba(255,212,121,.36), rgba(255,168,64,.20));
  border-color:rgba(255,212,121,.72);
  box-shadow:0 0 22px -4px rgba(255,212,121,.80), inset 0 0 12px rgba(255,212,121,.28);
  color:#ffe9b8;
}
.row.top2 .rank{
  background:linear-gradient(160deg, rgba(214,226,240,.30), rgba(160,180,205,.16));
  border-color:rgba(214,226,240,.62);
  box-shadow:0 0 18px -6px rgba(214,226,240,.62);
  color:#eef4ff;
}
.row.top3 .rank{
  background:linear-gradient(160deg, rgba(224,160,110,.30), rgba(180,120,80,.16));
  border-color:rgba(224,160,110,.58);
  box-shadow:0 0 18px -6px rgba(224,160,110,.62);
  color:#ffd9bd;
}

/* avatar halo for the top row */
.row.top1 .ava{
  box-shadow:0 0 0 2px rgba(255,212,121,.52), 0 0 28px -6px rgba(255,212,121,.90) !important;
}

/* level badge: gradient + inner light */
.badge{
  background:linear-gradient(160deg, rgba(120,170,220,.14), rgba(120,170,220,.05)) !important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 0 16px -8px currentColor !important;
  letter-spacing:.8px !important;
}

/* progress bar: thicker, glowing, animated shine */
.bar{height:9px !important;background:rgba(120,170,220,.10) !important;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.bar i{
  position:relative;
  box-shadow:0 0 16px -2px currentColor, inset 0 1px 0 rgba(255,255,255,.35) !important;
}
.bar i::after{
  content:"";position:absolute;inset:0;border-radius:99px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.42), transparent);
  background-size:55% 100%;background-repeat:no-repeat;
  animation:barShine 3.4s linear infinite;
}
@keyframes barShine{0%{background-position:-60% 0}100%{background-position:165% 0}}

/* rows: hover lift + left accent bar */
.row{
  transition:background .18s, transform .18s, box-shadow .18s;
  position:relative;
}
.row:hover{
  background:rgba(61,139,255,.085) !important;
  transform:translateX(2px);
  box-shadow:inset 3px 0 0 rgba(92,225,255,.50);
}

/* hero: deeper glow */
.hero{
  box-shadow:0 34px 78px -50px rgba(92,225,255,.70), inset 0 1px 0 rgba(160,220,255,.10) !important;
}

/* spark line: soft glow */
.spark polyline{filter:drop-shadow(0 0 4px currentColor)}


/* --- 好感度回应台词（放在名字/学号下方） --- */
.say{
  margin-top:6px;
  font-size:12px;
  line-height:1.55;
  opacity:.78;
  letter-spacing:.2px;
  font-style:italic;
  transition:opacity .18s;
}
.row:hover .say{opacity:1}
.row.top1 .say{opacity:.92}
@media (max-width:560px){
  .say{font-size:11px;margin-top:5px;line-height:1.6}
}

<script>
const API = '/api/v1/plugins/extensions/astrbot_plugin_affection/api';
const OWNER = '2021952647';
let DATA = { users: [], levels: [], max: 2140 };
let MAXV = 2140;
/* 只读模式（给外人看的链接）由页面自己置 true，默认 false */
let READONLY = window.__AFFECTION_READONLY__ === true;

/* 气泡背景 */
(function bubbles(){
  const box = document.getElementById('bubbles');
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('i');
    const s = 6 + Math.random() * 22;
    b.style.width = b.style.height = s + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDuration = (13 + Math.random() * 16) + 's';
    b.style.animationDelay = (-Math.random() * 20) + 's';
    b.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    b.style.opacity = 0.15 + Math.random() * 0.4;
    box.appendChild(b);
  }
})();

function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.className = 'toast', 2200);
}

const LEVEL_LINES = {
  '陌生': '唔…你、你谁呀，别突然靠这么近啦。',
  '初识': '嗯…好像见过你？那我先看着你好啦。',
  '熟悉': '你今天也来啦，刚好我在这儿呢。',
  '亲近': '诶嘿…跟你说话好像挺开心的。',
  '粘人': '又来找我啦？…那、那你坐这儿嘛。',
  '心动': '别一直盯着我看啦…会不好意思的。',
  '亲密': '你要是走了，我会偷偷想你的。',
  '认可': '嗯…你是我少数放在心里的人哦。',
  '心与魂': '你不在的时候，我会数你在不在。',
  '永世同频': '嘿嘿…我一直都在这儿等你呀。',
  '魂梦与共': '连做梦都在想你呢…这话我只说一次哦。',
  '生死同归': '你去哪儿我就跟到哪儿，赖上你了。'
};
function lineFor(level) {
  return LEVEL_LINES[level] || '…嗯。';
}

function hueFor(value){
  // 低→高：青 → 蓝 → 紫 → 金
  const r = Math.min(1, value / Math.max(1, MAXV));
  if (r > 0.82) return '#ffd479';
  if (r > 0.62) return '#a78bfa';
  if (r > 0.38) return '#5ce1ff';
  return '#3d8bff';
}
function badgeStyle(value){
  const c = hueFor(value);
  return `background:${c}1f;border-color:${c}66;color:${c}`;
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = document.getElementById('rows');
  let list = DATA.users.filter(u =>
    !q || u.name.toLowerCase().includes(q) || u.user_id.includes(q)
  );

  if (!list.length){
    rows.innerHTML = `<div class="empty">
      <div class="big">${DATA.users.length ? '没搜到这个人' : '册子还是空的'}</div>
      <div class="small">${DATA.users.length ? '换个昵称或 QQ 号试试' : '得先在群里混熟了，才会被记上一笔'}</div>
    </div>`;
  } else {
    rows.innerHTML = list.map((u, i) => {
      const pct = Math.min(100, (u.value / MAXV) * 100);
      const c = hueFor(u.value);
      const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const isOwner = u.user_id === OWNER;
      return `<div class="row ${rankCls}">
        <div class="rank">${String(i + 1).padStart(2, '0')}</div>
        <div class="who">
          <img class="ava" loading="lazy" src="${u.avatar}"
               onerror="this.style.visibility='hidden'">
          <div style="min-width:0">
            <div class="name">${esc(u.name)}${isOwner ? ' <span style="color:#ffd479;font-size:11px">主人</span>' : ''}</div>
            <div class="uid">${u.user_id}</div>
            <div class="say" style="color:${c}">「${esc(lineFor(u.level))}」</div>
          </div>
        </div>
        <div class="lv"><span class="badge" style="${badgeStyle(u.value)}">${esc(u.level)}</span>${sparkSvg(u.spark, c)}</div>
        <div class="val" style="color:${c}">${u.value}${u.overflow ? `<span class="ov">+${u.overflow}</span>` : ''}</div>
        <div class="bar"><i style="width:${pct}%;background:${c};color:${c}"></i></div>
        <div class="edit">
          ${READONLY ? `<span class="ro">只读</span>`

                    : `<input id="v_${u.user_id}" value="${u.value}" type="number" min="0" max="${MAXV}">
          <button class="mini" data-id="${u.user_id}">保存</button>`}
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('sCount').textContent = DATA.users.length;
  const avg = DATA.users.length
    ? Math.round(DATA.users.reduce((s, u) => s + u.value, 0) / DATA.users.length) : 0;
  document.getElementById('sAvg').textContent = avg;
  const mx = DATA.users.length ? Math.max(...DATA.users.map(u => u.value)) : 0;
  document.getElementById('sMax').textContent = mx;
  const owner = DATA.users.find(u => u.user_id === OWNER);
  document.getElementById('sOwner').textContent = owner ? owner.value : 0;
  document.getElementById('footCount').textContent = DATA.users.length + ' 人';
  document.getElementById('maxv').textContent = MAXV;
}

function sparkSvg(spark, color){
  if (!spark || spark.length < 2) return '';
  const w = 74, h = 20;
  const lo = Math.min(...spark), hi = Math.max(...spark);
  const span = (hi - lo) || 1;
  const pts = spark.map((v, i) => {
    const x = (i / (spark.length - 1)) * w;
    const y = h - ((v - lo) / span) * (h - 3) - 1.5;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">` +
         `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" ` +
         `stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/></svg>`;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}

async function load(){
  // 只读页（GitHub Pages / 8092）没有 /api/list 后端，刷新要改成拉 data.json。
  // 注意：绝不能在这里 fallback 到 location.reload() —— 主脚本执行时
  // reloadSnap 还没定义（它挂在页面最末尾的 boot 脚本里），会无限重载页面。
  // 另外这段注释里不要出现闭合 body 标签的原文，静态构建按字符串找注入点会插错地方。
  if (READONLY) {
    if (typeof reloadSnap === 'function') reloadSnap();
    return;
  }
  try {
    const r = await fetch(`${API}/list`, { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '读取失败');
    DATA = j;
    MAXV = j.max || 2140;
    const d = new Date();
    document.getElementById('syncTime').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    render();
  } catch (e){
    toast('读取失败：' + e.message, true);
  }
}

document.getElementById('rows').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.mini');
  if (!btn) return;
  const id = btn.dataset.id;
  const val = Number(document.getElementById('v_' + id).value);
  if (!Number.isFinite(val) || val < 0) return toast('数值不对', true);
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/set`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: id, value: val }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '保存失败');
    toast('已保存');
    await load();
  } catch (e){
    toast('保存失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('refresh').addEventListener('click', load);

/* 添加档案 */
const mask = document.getElementById('mask');
document.getElementById('addBtn').onclick = () => {
  mask.classList.add('on');
  document.getElementById('mQq').value = '';
  document.getElementById('mName').value = '';
  document.getElementById('mVal').value = '10';
  setTimeout(() => document.getElementById('mQq').focus(), 60);
};
document.getElementById('mCancel').onclick = () => mask.classList.remove('on');
mask.addEventListener('click', e => { if (e.target === mask) mask.classList.remove('on'); });
document.getElementById('mOk').onclick = async () => {
  const user_id = document.getElementById('mQq').value.trim();
  const name = document.getElementById('mName').value.trim();
  const value = Number(document.getElementById('mVal').value) || 0;
  if (!user_id) return toast('先填 QQ 号', true);
  if (value <= 0) return toast('好感度要大于 0 才会显示', true);
  try {
    const r = await fetch(`${API}/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id, name, value }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '添加失败');
    mask.classList.remove('on');
    toast('已添加');
    await load();
  } catch (e){
    toast('添加失败：' + e.message, true);
  }
};

/* ---------- 等级总览 ---------- */
const lvMask = document.getElementById('lvMask');

function renderLevels(){
  const levels = (DATA.levels || []).slice().sort((a, b) => a.value - b.value);
  if (!levels.length){
    document.getElementById('lvList').innerHTML =
      '<div class="empty"><div class="big">等级表还没读到</div><div class="small">刷新一下页面试试</div></div>';
    return;
  }
  const counts = {};
  DATA.users.forEach(u => { counts[u.level] = (counts[u.level] || 0) + 1; });
  const topName = DATA.users.length ? DATA.users[0].level : '';

  document.getElementById('lvList').innerHTML = levels.map((lv, i) => {
    const from = lv.value;
    const to = (i + 1 < levels.length) ? levels[i + 1].value : MAXV;
    const span = Math.max(1, MAXV);
    const w = Math.max(5, Math.min(100, ((to - from) / span) * 100));
    const mid = Math.round((from + to) / 2);
    const c = hueFor(mid);
    const n = counts[lv.name] || 0;
    const now = lv.name === topName;
    return `<div class="lv-item${now ? ' now' : ''}">
      <div class="lv-i">${String(i + 1).padStart(2, '0')}</div>
      <div class="lv-name" style="color:${c}">${esc(lv.name)}</div>
      <div class="lv-track"><i style="width:${w}%;background:${c};color:${c}"></i></div>
      <div class="lv-range">${from} – ${to}</div>
      <div class="lv-cnt"><b>${n}</b> 人</div>
    </div>`;
  }).join('');
}

document.getElementById('lvBtn').onclick = () => { renderLevels(); lvMask.classList.add('on'); };
document.getElementById('lvClose').onclick = () => lvMask.classList.remove('on');
lvMask.addEventListener('click', e => { if (e.target === lvMask) lvMask.classList.remove('on'); });

/* 只读模式：藏掉所有能改东西的入口 */
(function applyReadonly(){
  if (!READONLY) return;
  document.body.classList.add('readonly');
  const addBtn = document.getElementById('addBtn');
  if (addBtn) addBtn.remove();
  document.querySelectorAll('.mask').forEach(m => {
    if (m.id !== 'lvMask') m.remove();
  });
  const note = document.createElement('div');
  note.className = 'ro-note';
  note.textContent = '只读页面 · 好感度由群里相处慢慢长出来';
  const head = document.querySelector('.hero') || document.querySelector('.wrap');
  if (head) head.appendChild(note);
  document.title = '大肥鱼 · 好感度档案（只读）';
})();

/* 走来走去的那几只，共用同一张图（不重复占体积） */
(function shareWhale(){
  const brand = document.querySelector('.brand-whale');
  if (!brand || !brand.src) return;
  document.querySelectorAll('.walkImg, .flyImg').forEach(img => { img.src = brand.src; });
})();
